<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad-light-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-light">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#grad-light-1)" stroke-width="2" opacity="0.4"/>
  
  <!-- Main file icon -->
  <g filter="url(#glow-light)">
    <!-- File body -->
    <path d="M 60 40 L 60 160 Q 60 170 70 170 L 150 170 Q 160 170 160 160 L 160 70 L 110 20 Q 105 15 100 15 L 70 15 Q 60 15 60 25 Z" 
          fill="url(#grad-light-1)" opacity="0.85"/>
    
    <!-- File fold -->
    <path d="M 110 20 L 110 70 L 160 70" 
          fill="none" stroke="url(#grad-light-1)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Lock icon on file -->
    <g transform="translate(100, 110)">
      <!-- Lock body -->
      <rect x="-18" y="-8" width="36" height="32" rx="4" 
            fill="none" stroke="url(#grad-light-1)" stroke-width="2"/>
      <!-- Lock shackle -->
      <path d="M -12 -8 Q -12 -20 0 -20 Q 12 -20 12 -8" 
            fill="none" stroke="url(#grad-light-1)" stroke-width="2" stroke-linecap="round"/>
      <!-- Lock dot -->
      <circle cx="0" cy="8" r="2" fill="url(#grad-light-1)"/>
    </g>
  </g>
  
  <!-- Encryption indicator -->
  <g transform="translate(155, 155)" opacity="0.9">
    <circle cx="0" cy="0" r="12" fill="#0d9488" opacity="0.25"/>
    <path d="M -3 0 L 0 3 L 4 -1" 
          fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>